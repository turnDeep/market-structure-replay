name: fix-title-guard

# One-time presentation fix: correct the saved-title guard literal inside the
# packaged v0.13 apps (v0.12 saved titles were never auto-corrected).
# Added by the repository owner (the Muse GitHub App cannot write workflow
# files). Runs scripts/fix_title_guard.py, the test suite, and commits the
# patched assets only when everything passes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["release/fix-title-guard.trigger"]

permissions:
  contents: write

concurrency:
  group: fix-title-guard
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements-refresh.txt
      - name: Patch the packaged title guard
        run: python scripts/fix_title_guard.py
      - name: Run the test suite
        run: python -m pytest -q
      - name: Commit the patched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch release/fix-title-guard.trigger
          git add assets/nq.html.gz assets/es.html.gz assets/manifest.json
          git commit -m "Fix packaged title guard: correct v0.12 saved titles to v0.13"
          git push
